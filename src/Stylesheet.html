<style>
  :root {
    --green: #2e7d32;
    --green-dark: #1b5e20;
    --amber: #a05a00;
    --gray: #555;
    --border: #d8d8d8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    background: #f6f7f5;
    color: #222;
  }
  header.topbar {
    background: var(--green);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  header.topbar h1 { font-size: 17px; margin: 0; font-weight: 600; }
  #progress { font-size: 13px; opacity: .95; }
  #statusBar {
    padding: 6px 20px;
    font-size: 13px;
    background: #fff8e6;
    color: var(--amber);
    display: none;
  }
  #statusBar.show { display: block; }
  #statusBar.ok { background: #e8f5e9; color: var(--green-dark); }
  main { max-width: 820px; margin: 0 auto; padding: 18px 16px 100px; }

  .chooser { text-align: center; padding: 60px 20px; }
  .chooser h2 { margin-bottom: 6px; }
  .chooser p { color: var(--gray); }
  .chooser button.big {
    display: block;
    width: 100%;
    max-width: 480px;
    margin: 10px auto;
    padding: 16px;
    font-size: 15px;
    border: 1px solid var(--green);
    background: #fff;
    color: var(--green-dark);
    border-radius: 8px;
    cursor: pointer;
  }
  .chooser button.big:hover { background: #eef7ee; }
  .pending-note { color: var(--amber); font-size: 13px; margin-top: 4px; }

  .section-title { font-size: 19px; font-weight: 700; margin: 10px 0 14px; }
  .question {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .question h3 { margin: 0 0 8px; font-size: 14px; color: var(--green-dark); }
  .question .instructions { font-size: 12.5px; color: var(--gray); margin-bottom: 10px; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { display: block; font-size: 13.5px; margin-bottom: 6px; }
  .field-label.bold { font-weight: 700; }

  .input-text {
    width: 100%;
    max-width: 420px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 13.5px;
  }
  textarea.input-text { max-width: 100%; min-height: 60px; font-family: inherit; }

  .choice-group { display: flex; flex-direction: column; gap: 4px; }
  .choice-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .choice-row label { font-size: 13.5px; }
  .specify-input {
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12.5px;
    width: 180px;
  }

  .scale-row { display: flex; gap: 14px; align-items: center; }
  .scale-row label { font-size: 13px; }

  table.matrix { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 12.5px; }
  table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 5px 7px; text-align: left; }
  table.matrix th { background: #f0f3ef; font-weight: 600; }
  table.matrix input.input-text { max-width: 100px; padding: 4px 6px; }
  table.matrix .choice-row { gap: 2px 10px; }

  footer.navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    font-size: 13.5px;
    padding: 9px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  button.primary:hover { background: var(--green-dark); }
  button.link { border: none; background: none; color: var(--green-dark); text-decoration: underline; }
  .navgroup { display: flex; gap: 8px; }

  .spinner-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,.7);
    display: none; align-items: center; justify-content: center; z-index: 50;
    font-size: 14px; color: var(--green-dark);
  }
  .spinner-overlay.show { display: flex; }
</style>
