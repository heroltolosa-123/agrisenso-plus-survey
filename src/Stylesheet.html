<style>
/* =====================================================================
   AGRISENSO Plus Baseline Survey — visual system
   Palette and type scale draw from the LANDBANK Agrisenso Plus branding
   and the rice-field photography already used on the landing screen.
   Signature element: the "planted rows" progress indicator in the top
   bar — a nod to fields being filled in, row by row, as the interview
   progresses.
   ===================================================================== */
:root {
  --green: #2f7d4f;
  --green-dark: #17512f;
  --green-pale: #e9f5ee;
  --amber: #b5730a;
  --amber-pale: #fff6e2;
  --amber-border: #f0d385;
  --red: #b3271e;
  --red-pale: #fdeeed;
  --ink: #232922;
  --gray: #5b6459;
  --paper: #fffdf9;
  --border: #e2ddd0;
  --shadow: 0 2px 10px rgba(35, 41, 34, 0.07);
  --shadow-lift: 0 6px 20px rgba(35, 41, 34, 0.12);
  --radius: 10px;
  --font-display: Iowan Old Style, Palatino Linotype, URW Palladio, Georgia, serif;
  --font-body: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.22, .61, .36, 1);
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  margin: 0;
  color: var(--ink);
  background-image:
    linear-gradient(rgba(250, 249, 245, 0.94), rgba(250, 249, 245, 0.97)),
    var(--bg-image);
  background-size: cover;
  background-position: center top;
  background-attachment: fixed;
  background-repeat: no-repeat;
  min-height: 100vh;
}

/* ---------------- Header + progress ---------------- */
header.topbar {
  background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
  color: #fff;
  padding: 16px 28px;
}
.topbar-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  max-width: 1100px;
  margin: 0 auto;
}
header.topbar h1 {
  font-family: var(--font-display);
  font-size: 22px;
  margin: 0;
  font-weight: 600;
  letter-spacing: .2px;
}
#progressText { font-size: 14px; opacity: .95; }

.rows-progress {
  display: flex;
  gap: 5px;
  max-width: 1100px;
  margin: 12px auto 0;
  padding: 0 28px;
}
.rows-progress .seg {
  flex: 1;
  height: 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.28);
  overflow: hidden;
}
.rows-progress .seg > span {
  display: block;
  height: 100%;
  width: 0%;
  background: #d9e97a;
  border-radius: 4px;
  transition: width .5s var(--ease);
}
.rows-progress .seg.done > span { width: 100%; }
.rows-progress .seg.current > span { width: 55%; }

#statusBar {
  padding: 12px 28px;
  font-size: 15px;
  background: var(--amber-pale);
  color: var(--amber);
  border-bottom: 1px solid var(--amber-border);
  display: none;
  animation: slideDown .3s var(--ease);
}
#statusBar.show { display: block; }
#statusBar.ok { background: var(--green-pale); color: var(--green-dark); border-color: #bfe3cd; }
#statusBar.err { background: var(--red-pale); color: var(--red); font-weight: 600; border-color: #f3c6c2; }

@keyframes slideDown {
  from { transform: translateY(-8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

main { max-width: 1040px; margin: 0 auto; padding: 26px 24px 120px; }

/* ---------------- Chooser / landing screen ---------------- */
.chooser { text-align: center; padding: 0 0 40px; }
.hero-banner {
  background-image: var(--banner-image);
  background-size: cover;
  background-position: center;
  height: 240px;
  border-radius: 0 0 18px 18px;
  box-shadow: var(--shadow-lift);
  margin-bottom: 32px;
}
@media (max-width: 480px) { .hero-banner { height: 160px; } }

.chooser h2 {
  font-family: var(--font-display);
  font-size: 26px;
  margin-bottom: 8px;
  color: var(--green-dark);
}
.chooser p { color: var(--gray); }
.chooser .card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 34px 28px 40px;
  max-width: 620px;
  margin: 0 auto;
  box-shadow: var(--shadow);
}
.chooser button.big {
  display: block;
  width: 100%;
  max-width: 500px;
  margin: 12px auto;
  padding: 20px 22px;
  font-size: 17px;
  font-weight: 600;
  border: 1.5px solid var(--green);
  background: #fff;
  color: var(--green-dark);
  border-radius: 12px;
  cursor: pointer;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background-color .15s var(--ease);
}
.chooser button.big:hover:not(:disabled) {
  background: var(--green-pale);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.chooser button.big:active:not(:disabled) { transform: translateY(0); }
.chooser button.big:disabled { opacity: .45; cursor: not-allowed; }
.pending-note { color: var(--amber); font-size: 14px; margin-top: 6px; }

.setup-note {
  max-width: 620px;
  margin: 0 auto 20px;
  background: var(--amber-pale);
  border: 1px solid var(--amber-border);
  color: var(--amber);
  border-radius: var(--radius);
  padding: 14px 18px;
  font-size: 14.5px;
  text-align: left;
}

/* ---------------- Section content ---------------- */
.section-title {
  font-family: var(--font-display);
  font-size: 27px;
  font-weight: 600;
  color: var(--green-dark);
  margin: 6px 0 16px;
  animation: fadeSlideIn .4s var(--ease) both;
}
.required-banner {
  font-size: 14.5px;
  color: var(--amber);
  background: var(--amber-pale);
  border: 1px solid var(--amber-border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 18px;
  animation: fadeSlideIn .4s var(--ease) both;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.question {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  animation: fadeSlideIn .45s var(--ease) both;
}
.question h3 {
  margin: 0 0 10px;
  font-size: 17.5px;
  font-weight: 700;
  color: var(--green-dark);
}
.question .instructions {
  font-size: 14px;
  color: var(--gray);
  margin-bottom: 12px;
  line-height: 1.55;
}

/* ---------------- Fields ---------------- */
.field { margin-bottom: 18px; transition: background-color .2s, border-color .2s; }
.field:last-child { margin-bottom: 0; }
.field-label { display: block; font-size: 15.5px; margin-bottom: 8px; line-height: 1.45; }
.field-label.bold { font-weight: 700; }

.field.field-missing {
  border: 2px solid var(--red);
  background: var(--red-pale);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  margin-left: -14px;
  margin-right: -14px;
  animation: shake .35s var(--ease);
}
.field.field-missing::before {
  content: "This question needs an answer (or N/A).";
  display: block;
  color: var(--red);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
}
@keyframes shake {
  10%, 90% { transform: translateX(-1px); }
  20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-4px); }
  40%, 60% { transform: translateX(4px); }
}

.input-text {
  width: 100%;
  max-width: 460px;
  padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
  background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.input-text:focus {
  outline: none;
  border-color: var(--green);
  box-shadow: 0 0 0 3px var(--green-pale);
}
textarea.input-text { max-width: 100%; min-height: 76px; }

.select-wrap { position: relative; max-width: 460px; }
select.input-select {
  width: 100%;
  padding: 11px 40px 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
  background: #fff;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
select.input-select:focus {
  outline: none;
  border-color: var(--green);
  box-shadow: 0 0 0 3px var(--green-pale);
}
.select-wrap::after {
  content: "";
  position: absolute;
  right: 15px;
  top: 50%;
  width: 9px;
  height: 9px;
  border-right: 2.5px solid var(--gray);
  border-bottom: 2.5px solid var(--gray);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.datetime-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.input-datetime { max-width: 220px; }
.input-datetime:disabled { background: #f2f0ea; color: var(--gray); }
.na-checkbox { display: flex; align-items: center; gap: 6px; font-size: 14.5px; color: var(--gray); cursor: pointer; }
.na-checkbox input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; }

.choice-group { display: flex; flex-direction: column; gap: 6px; }
.choice-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 7px 10px;
  border-radius: 8px;
  transition: background-color .15s;
}
.choice-row:hover { background: var(--green-pale); }
.choice-row label { font-size: 15.5px; cursor: pointer; }
.choice-row input[type="radio"],
.choice-row input[type="checkbox"] {
  width: 19px;
  height: 19px;
  accent-color: var(--green);
  cursor: pointer;
}
.specify-input {
  padding: 6px 9px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 14.5px;
  width: 200px;
  font-family: inherit;
}

.scale-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.scale-row label { font-size: 15px; cursor: pointer; }
.scale-row input[type="radio"] { width: 19px; height: 19px; accent-color: var(--green); cursor: pointer; }

table.matrix { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14.5px; }
table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 9px 10px; text-align: left; }
table.matrix th { background: var(--green-pale); font-weight: 700; color: var(--green-dark); }
table.matrix input.input-text { max-width: 110px; padding: 7px 9px; font-size: 15px; }
table.matrix .choice-row:hover { background: #dcefe3; }

/* ---------------- Bottom nav ---------------- */
footer.navbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  border-top: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 -4px 16px rgba(35, 41, 34, 0.08);
}
button {
  font-size: 15px;
  font-family: inherit;
  padding: 12px 20px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  background: #fff;
  cursor: pointer;
  transition: transform .12s var(--ease), box-shadow .12s var(--ease), background-color .12s var(--ease);
}
button:hover:not(:disabled) { box-shadow: var(--shadow); transform: translateY(-1px); }
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { opacity: .4; cursor: default; }
button.primary {
  background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
  color: #fff;
  border-color: var(--green-dark);
  font-weight: 600;
}
button.primary:hover:not(:disabled) { box-shadow: var(--shadow-lift); }
button.link { border: none; background: none; color: var(--green-dark); text-decoration: underline; padding: 8px 6px; }
.navgroup { display: flex; gap: 10px; }

.spinner-overlay {
  position: fixed; inset: 0; background: rgba(255, 253, 249, .8);
  display: none; align-items: center; justify-content: center; z-index: 50;
  font-size: 16px; color: var(--green-dark); font-weight: 600;
}
.spinner-overlay.show { display: flex; }
.spinner-overlay .dot {
  display: inline-block; width: 9px; height: 9px; margin: 0 3px;
  border-radius: 50%; background: var(--green);
  animation: bounce 1s infinite ease-in-out;
}
.spinner-overlay .dot:nth-child(2) { animation-delay: .15s; }
.spinner-overlay .dot:nth-child(3) { animation-delay: .3s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(.6); opacity: .5; }
  40% { transform: scale(1); opacity: 1; }
}

@media (max-width: 600px) {
  body { font-size: 16px; }
  header.topbar { padding: 14px 16px; }
  main { padding: 20px 14px 130px; }
  .section-title { font-size: 22px; }
  footer.navbar { padding: 12px 14px; }
  button { padding: 11px 14px; font-size: 14px; }
}
</style>
